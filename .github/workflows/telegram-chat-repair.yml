name: Repair Telegram chat ID

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Telegram client dependency
        run: python -m pip install requests==2.32.5
      - name: Discover and encrypt the recent private chat ID
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        shell: bash
        run: |
          CHAT_ID="$(python telegram_chat_repair.py)"
          echo "::add-mask::$CHAT_ID"
          CIPHERTEXT="$(printf '%s' "$CHAT_ID" | openssl pkeyutl -encrypt -pubin -inkey telegram_repair_public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 | base64 -w0)"
          echo "Encrypted Telegram chat ID: $CIPHERTEXT"
