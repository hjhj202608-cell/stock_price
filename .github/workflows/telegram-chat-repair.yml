name: Repair Telegram chat ID

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Telegram client dependency
        run: python -m pip install requests==2.32.5
      - name: Discover the recent private chat and update the secret
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          CHAT_ID="$(python telegram_chat_repair.py)"
          echo "::add-mask::$CHAT_ID"
          printf '%s' "$CHAT_ID" | gh secret set TELEGRAM_CHAT_ID --repo "$GITHUB_REPOSITORY"
          echo "TELEGRAM_CHAT_ID updated without exposing its value."
