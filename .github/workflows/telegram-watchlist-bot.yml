name: Telegram watchlist bot

on:
  schedule:
    - cron: "*/5 * * * *"
  repository_dispatch:
    types: [telegram_watchlist_commands]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-watchlist-bot
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Process Telegram commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_watchlist_bot.py
