name: KRX 15:30 close alert

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      target_date:
        description: Optional historical KRX date to send (YYYY-MM-DD)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: krx-close-alert
  cancel-in-progress: false

jobs:
  notify:
    # 키움 요청만 고정 IP인 cron-job.org 임시 작업을 통해 중계합니다.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Send verified KRX close prices
        env:
          CRONJOB_API_KEY: ${{ secrets.CRONJOB_API_KEY }}
          KIWOOM_APP_KEY: ${{ secrets.KIWOOM_APP_KEY }}
          KIWOOM_APP_SECRET: ${{ secrets.KIWOOM_APP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TARGET_DATE: ${{ inputs.target_date }}
        run: python stock_close_alert.py
